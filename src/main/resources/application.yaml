server:
  port: ${PORT:8080}

spring:
  application:
    name: service-desk

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:service_desk_db}
    username: ${DB_USER:malik}
    password: ${DB_PASSWORD:12345678}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: ${SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: ${FORMAT_SQL:true}

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  secret-encoding: ${JWT_SECRET_ENCODING:hex}
  expiration: ${JWT_EXPIRATION:900000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

app:
  cors:
    allowed-origins: "${CORS_ALLOWED_ORIGINS:}"
    allowed-origin-patterns: "${CORS_ALLOWED_ORIGIN_PATTERNS:https://*.vercel.app}"
